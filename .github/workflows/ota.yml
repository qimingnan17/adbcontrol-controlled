# OTA 自动发布流水线。
#
# 触发:推送 v* 形式的 tag(如 v1.0.1)。
# 流程:构建 debug 签名 APK(versionCode=提交计数,versionName=tag)
#      → 计算 sha256 → 上传到 GitHub Release
#      → POST {后端}/api/updates/publish 注册版本清单并广播 update_available。
#
# 需要的仓库 Secrets(一次性配置):
#   ADB_BACKEND_URL  如 https://adbcontrol-backend.fly.dev
#   ADB_PM_TOKEN     与后端 ADB_PM_TOKEN 环境变量一致

name: OTA Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # rev-list 计数需要完整历史

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve version
        id: ver
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="$(git rev-list --count HEAD)"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building v$VERSION_NAME (code=$VERSION_CODE)"

      - name: Build debug APK (debug signing for OTA sideload)
        run: >
          ./gradlew :controlled:assembleDebug --no-daemon
          -PversionCode=${{ steps.ver.outputs.version_code }}
          -PversionName=${{ steps.ver.outputs.version_name }}

      - name: Hash APK
        id: hash
        run: |
          APK="controlled/build/outputs/apk/debug/controlled-debug.apk"
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA size=$SIZE"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: controlled/build/outputs/apk/debug/controlled-debug.apk

      - name: Publish manifest to backend
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/controlled-debug.apk"
          BODY=$(cat <<EOF
          {
            "versionCode": ${{ steps.ver.outputs.version_code }},
            "versionName": "${TAG}",
            "channel": "stable",
            "priority": "NORMAL",
            "fullApkUrl": "${URL}",
            "sha256": "${{ steps.hash.outputs.sha256 }}",
            "sizeBytes": ${{ steps.hash.outputs.size }},
            "releaseNotes": "Release ${{ github.ref_name }}"
          }
          EOF
          )
          HTTP=$(curl -sS -o /tmp/pub.out -w '%{http_code}' \
            -X POST "${{ secrets.ADB_BACKEND_URL }}/api/updates/publish" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: ${{ secrets.ADB_PM_TOKEN }}" \
            -d "$BODY")
          cat /tmp/pub.out; echo
          if [ "$HTTP" != "200" ]; then echo "::error::publish failed http=$HTTP"; exit 1; fi
